<!DOCTYPE html>
<html>
  <head>
   <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.name }} </title> <!-- – {{ site.description }}</title> -->

    {% include meta.html %}

    <!--[if lt IE 9]>
      <script src="http://html5shiv.googlecode.com/svn/trunk/html5.js"></script>
    <![endif]-->

    <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css" />
    <link rel="alternate" type="application/rss+xml" title="{{ site.name }} - {{ site.description }}" href="{{ site.baseurl }}/feed.xml" />

    <!-- Created with Jekyll Now - http://github.com/barryclark/jekyll-now -->
  </head>

  <body>
    <div class="wrapper-masthead">
      <div class="container">
        <header class="masthead clearfix">
          <a href="{{ site.baseurl }}/" class="site-avatar"><img src="{{ site.avatar }}" /></a>

          <div class="site-info">
            <h1 class="site-name"><a href="{{ site.baseurl }}/">{{ site.name }}</a></h1>
            <p class="site-description">{{ site.description }}</p>
          </div>

          <nav>
            <!-- <a href="{{ site.baseurl }}/">Blog</a>> 
            <a href="{{ site.baseurl }}/architecture">Architecture</a> 
            <a href="{{ site.baseurl }}/linux">Linux</a> -->
            <a href="{{ site.baseurl }}/presentation">Presentation</a> 
            <a href="{{ site.baseurl }}/utility">Utilities</a> 
            <a href="{{ site.baseurl }}/about">About</a>
          </nav>
        </header>
      </div>
    </div>

    <div id="main" role="main" class="container">
      {{ content }}
    </div>

    <div class="wrapper-footer">
      <div class="container">
        <footer class="footer">
          {% include svg-icons.html %}
        </footer>
      </div>
    </div>

    <script type="module">
      import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";

      // Support both explicit .mermaid blocks and markdown code fences rendered by Jekyll.
      document.querySelectorAll("pre > code.language-mermaid").forEach((codeBlock) => {
        const pre = codeBlock.parentElement;
        const div = document.createElement("div");
        div.className = "mermaid";
        div.textContent = codeBlock.textContent;
        pre.parentNode.replaceChild(div, pre);
      });

      mermaid.initialize({ startOnLoad: true, securityLevel: "loose" });
    </script>

    {% include analytics.html %}
  </body>
</html>
