<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' | escape }}">
  <head>
    {% include meta.html %}

    <!--[if lt IE 9]>
      <script src="http://html5shiv.googlecode.com/svn/trunk/html5.js"></script>
    <![endif]-->

    <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css" />
    <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}" />

    <!-- Created with Jekyll Now - http://github.com/barryclark/jekyll-now -->
  </head>

  <body>
    <div class="wrapper-masthead">
      <div class="container">
        <header class="masthead clearfix">
          <a href="{{ site.baseurl }}/" class="site-avatar"><img src="{{ site.avatar }}" alt="{{ site.author.name | escape }}" width="70" height="70" /></a>

          <div class="site-info">
            <p class="site-name"><a href="{{ site.baseurl }}/">{{ site.name | escape }}</a></p>
            <p class="site-description">{{ site.tagline | escape }}</p>
          </div>

          <nav>
            <!-- <a href="{{ site.baseurl }}/">Blog</a>> 
            <a href="{{ site.baseurl }}/architecture">Architecture</a> 
            <a href="{{ site.baseurl }}/linux">Linux</a> -->
            <a href="{{ '/presentation/' | relative_url }}">Presentations</a>
            <a href="{{ '/utility/' | relative_url }}">Utilities</a>
            <a href="{{ '/about/' | relative_url }}">About</a>
          </nav>
        </header>
      </div>
    </div>

    <div id="main" role="main" class="container">
      {{ content }}
    </div>

    <div class="wrapper-footer">
      <div class="container">
        <footer class="footer">
          {% include svg-icons.html %}
        </footer>
      </div>
    </div>

    <script type="module">
      import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";

      // Support both explicit .mermaid blocks and markdown code fences rendered by Jekyll.
      document.querySelectorAll("pre > code.language-mermaid").forEach((codeBlock) => {
        const pre = codeBlock.parentElement;
        const div = document.createElement("div");
        div.className = "mermaid";
        div.textContent = codeBlock.textContent;
        pre.parentNode.replaceChild(div, pre);
      });

      mermaid.initialize({ startOnLoad: true, securityLevel: "loose" });
    </script>

    {% include analytics.html %}
  </body>
</html>
